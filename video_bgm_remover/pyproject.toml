[project]
name = "video-bgm-remover"
version = "0.1.0"
description = "Remove background music from videos while keeping speech"
requires-python = ">=3.10,<3.14"
dependencies = [
    "audio-separator[cpu]==0.44.5",
    "audioread>=3.0.1,<4",
    "librosa>=0.10,<1",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"
